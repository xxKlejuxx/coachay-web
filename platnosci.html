<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COACHAY — Wybierz plan</title>
<link rel="stylesheet" href="_global.css?v=20260730a">
<link rel="stylesheet" href="_desktop.css?v=20260821c">
<script src="_i18n.js?v=20260820"></script>
<script src="_sidebar.js?v=20260821b"></script>
<style>
:root { --phone-h: 750px; }

.screen-body {
    flex: 1; display: flex; flex-direction: column;
    overflow-y: auto; scrollbar-width: none;
    padding-bottom: 32px;
}
.screen-body::-webkit-scrollbar { display: none; }

/* ── Kontener — wyśrodkowany, max 1222px ── */
.pay-container {
    max-width: 1222px;
    margin: 0 auto;
    width: 100%;
    padding: 20px 28px 80px;
    display: flex;
    flex-direction: column;
}

/* ── Tytuł sekcji ── */
.pay-title {
    padding: 0 0 6px;
    font-family: var(--font-d); font-size: 27px; font-weight: 800;
    color: var(--bialy); letter-spacing: 0.5px;
}
.pay-subtitle {
    padding: 0 0 24px;
    font-size: 19px; font-weight: 600; color: var(--szary);
    line-height: 1.6;
}

/* ── Toggle Indywidualny / Rodzinny ── */
.pay-toggle-wrap {
    margin: 0 0 20px;
    background: var(--tlo-karta); border: 1px solid var(--border);
    border-radius: var(--r-pill); padding: 4px;
    display: flex;
}
.pay-toggle-btn {
    flex: 1; padding: 9px;
    border-radius: var(--r-pill);
    font-size: 21px; font-weight: 900;
    color: var(--szary); cursor: pointer; border: none;
    background: none; transition: all 0.2s;
}
.pay-toggle-btn.active {
    background: var(--tlo-karta2);
    color: var(--bialy);
    border: 1px solid var(--border2);
}

/* ── Karty pakietów ── */
.pay-cards { padding: 0; display: flex; flex-direction: column; gap: 10px; }

.pay-card {
    background: var(--tlo-karta); border: 1.5px solid var(--border);
    border-radius: var(--r); padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
    position: relative;
}
.pay-card:active { background: var(--tlo-karta2); }
.pay-card.selected {
    border-color: var(--akcent);
    background: rgba(59,130,246,0.06);
}

.pay-card-radio {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--border2);
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s;
}
.pay-card.selected .pay-card-radio {
    border-color: var(--akcent);
    background: var(--akcent);
}
.pay-card-radio::after {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: #fff; display: none;
}
.pay-card.selected .pay-card-radio::after { display: block; }

.pay-card-info { flex: 1; }
.pay-card-name {
    font-family: var(--font-d); font-size: 23px; font-weight: 800; color: var(--bialy);
    display: flex; align-items: center; gap: 7px;
}
.pay-card-sub { font-size: 21px; font-weight: 600; color: var(--szary-j); margin-top: 4px; line-height: 1.4; }

.pay-badge {
    font-size: 14px; font-weight: 900; letter-spacing: 1px;
    text-transform: uppercase; padding: 3px 8px;
    border-radius: var(--r-pill);
    background: rgba(74,222,128,0.15); color: var(--sukces);
    border: 1px solid rgba(74,222,128,0.25);
}
.pay-badge.popular {
    background: rgba(59,130,246,0.15); color: #60A5FA;
    border-color: rgba(59,130,246,0.25);
}

.pay-card-price {
    text-align: right; flex-shrink: 0;
}
.pay-card-amount {
    font-family: var(--font-d); font-size: 23px; font-weight: 800; line-height: 1;
    color: var(--bialy);
}
.pay-card-period { font-family: var(--font); font-size: 17px; font-weight: 600; color: var(--szary); margin-top: 2px; }

/* ── Divider ── */
.pay-divider {
    margin: 20px 0;
    display: flex; align-items: center; gap: 10px;
}
.pay-divider-line { flex: 1; height: 1px; background: var(--border); }
.pay-divider-txt { font-size: 16px; font-weight: 700; color: var(--szary); white-space: nowrap; }

/* ── Sekcja metody płatności ── */
.pay-method-label {
    padding: 0 0 10px;
    font-size: 15px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; color: var(--szary);
}
.pay-methods { padding: 0; display: flex; flex-direction: column; gap: 8px; }

.pay-method-btn {
    width: 100%; padding: 14px 18px;
    border-radius: var(--r); border: 1.5px solid rgba(255,255,255,0.1);
    background: #0B0C0E;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: border-color 0.2s, background 0.2s;
    font-family: var(--font);
}
.pay-method-btn:hover { border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
.pay-method-btn:active { background: rgba(255,255,255,0.08); }
.pay-method-btn.pl-only { display: none; }
.pay-method-btn.app-only { opacity: 0.5; cursor: not-allowed; }
.pay-method-btn.app-only:hover { border-color: rgba(255,255,255,0.1); background: #0B0C0E; }
.app-only-badge { font-size: 13px; font-weight: 700; color: #94A3B8; white-space: nowrap; display: flex; align-items: center; gap: 4px; }

.pay-method-icon {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    background: var(--tlo-karta2); border: 1px solid var(--border2);
}
.pay-method-info { flex: 1; text-align: left; }
.pay-method-name { font-size: 21px; font-weight: 800; color: var(--bialy); }
.pay-method-sub  { font-size: 19px; font-weight: 600; color: #94A3B8; margin-top: 2px; }
.pay-method-chevron { flex-shrink: 0; opacity: 0.5; transition: opacity 0.2s; }
.pay-method-btn:hover .pay-method-chevron { opacity: 1; }

/* ── Stopka ── */
.pay-footer {
    padding: 18px 0 0;
    font-size: 19px; font-weight: 600; color: var(--szary);
    text-align: center; line-height: 1.6;
}
</style>
</head>
<body>
<div class="phone">
    <div class="notch"></div>
    <div class="pay-bg"></div>

    <div class="screen-body">
      <div class="pay-container">

        <div class="pay-title" data-i18n="platnosci.headerTitle">Wybierz plan</div>
        <div class="pay-subtitle" data-i18n="platnosci.subtitle">Pełny dostęp do Coachay. Anuluj kiedy chcesz.</div>

        <!-- Toggle Indywidualny / Rodzinny -->
        <div class="pay-toggle-wrap">
            <button class="pay-toggle-btn active" id="tab-ind" onclick="setTab('individual')" data-i18n="platnosci.planIndividual">Indywidualny</button>
            <button class="pay-toggle-btn" id="tab-fam" onclick="setTab('family')" data-i18n="platnosci.planFamily">Rodzinny</button>
        </div>

        <!-- Karty pakietów -->
        <div class="pay-cards" id="pay-cards"></div>

        <!-- Divider -->
        <div class="pay-divider">
            <div class="pay-divider-line"></div>
            <div class="pay-divider-txt" data-i18n="platnosci.methodLabel">Wybierz metodę płatności</div>
            <div class="pay-divider-line"></div>
        </div>

        <!-- Metody płatności -->
        <div class="pay-method-label" data-i18n="platnosci.methodLabel">Zapłać przez</div>
        <div class="pay-methods">

            <!-- Przelewy24 — tylko PL -->
            <button class="pay-method-btn pl-only" id="btn-p24" onclick="payWith('przelewy24')">
                <div class="pay-method-icon" style="background:#1A1A2E; border-color:#2D2D5E;">
                    <svg width="32" height="14" viewBox="0 0 120 52" fill="none">
                        <text x="2" y="40" font-family="Arial Black,sans-serif" font-weight="900" font-size="44" fill="#E8332A">P</text>
                        <text x="30" y="40" font-family="Arial Black,sans-serif" font-weight="900" font-size="44" fill="#ffffff">24</text>
                    </svg>
                </div>
                <div class="pay-method-info">
                    <div class="pay-method-name">Przelewy24</div>
                    <div class="pay-method-sub" data-i18n="platnosci.methodP24Desc">BLIK · karta · przelew · tylko Polska</div>
                </div>
                <svg class="pay-method-chevron" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
            </button>

            <!-- Google Play — tylko w aplikacji -->
            <button class="pay-method-btn app-only" disabled>
                <div class="pay-method-icon" style="background:#1A1A1A; border-color:#2A2A2A;">
                    <svg width="22" height="22" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                </div>
                <div class="pay-method-info">
                    <div class="pay-method-name" data-i18n="platnosci.methodGooglePlay">Google Play</div>
                    <div class="pay-method-sub" data-i18n="platnosci.appOnlySub">Tylko w aplikacji mobilnej</div>
                </div>
                <span class="app-only-badge">📱</span>
            </button>

            <!-- Apple — tylko w aplikacji -->
            <button class="pay-method-btn app-only" disabled>
                <div class="pay-method-icon" style="background:#1A1A1A; border-color:#2A2A2A;">
                    <svg width="20" height="22" viewBox="0 0 814 1000" fill="white">
                        <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 790.7 0 663 0 541.8c0-207.5 135.4-317.5 269-317.5 70.1 0 128.4 46.4 172.5 46.4 43.4 0 112.7-49 192.8-49 34.3 0 122.3 3.2 174.7 93.3zm-169-156c-28.6 34.6-73.5 62.2-120.8 58.7-5.8-48.3 16.9-99.3 44.2-131.3 27.9-33.8 79.8-62.2 120.8-63.5 5.2 50.3-14.9 98.7-44.2 136.1z"/>
                    </svg>
                </div>
                <div class="pay-method-info">
                    <div class="pay-method-name" data-i18n="platnosci.methodApple">Apple</div>
                    <div class="pay-method-sub" data-i18n="platnosci.appOnlySub">Tylko w aplikacji mobilnej</div>
                </div>
                <span class="app-only-badge">📱</span>
            </button>

        </div>

        <!-- Stopka -->
        <div class="pay-footer" id="pay-footer" data-i18n="platnosci.pickPlanFirstHint">
            Wybierz pakiet powyżej, a następnie metodę płatności.
        </div>

      </div><!-- /.pay-container -->
    </div>
</div>

<script src="coachay-core.js?v=20260903d"></script>
<script>
/* ═══════════════════════════════════════════════════
   PLATNOSCI — logika ekranu
═══════════════════════════════════════════════════ */

const params   = new URLSearchParams(location.search);
const CLUB_ID  = params.get('clubId') || '';
const REDIRECT = params.get('redirect') || 'start.html';

/* ── Pakiety ── */
const _tPl = (key, fb) => typeof t === 'function' ? t(key) : fb;

function getPLANS() {
    return {
        individual: [
            { id: 'sub_individual_monthly',
              name: _tPl('platnosci.planMonthlyName', 'Miesięczny'),
              period: _tPl('platnosci.periodMonthly', 'mies.'),
              sub: _tPl('platnosci.subMonthlyDesc', '30 dni dostępu'),
              priceBase: '5,99 zł', priceApple: '11,99 zł', badge: null },
            { id: 'sub_individual_yearly',
              name: _tPl('platnosci.planYearlyName', 'Roczny'),
              period: _tPl('platnosci.periodYearly', 'rok'),
              sub: _tPl('platnosci.subYearlyDesc', '2 miesiące gratis'),
              priceBase: '59,99 zł', priceApple: '119,99 zł',
              badge: _tPl('platnosci.badgeRecommended', 'Polecane') },
        ],
        family: [
            { id: 'sub_family_monthly',
              name: _tPl('platnosci.planFamilyMonthlyName', 'Rodzinny mies.'),
              period: _tPl('platnosci.periodMonthly', 'mies.'),
              sub: _tPl('platnosci.subFamilyMonthlyDesc', '6 kont · 30 dni'),
              priceBase: '23,99 zł', priceApple: '47,99 zł', badge: null },
            { id: 'sub_family_yearly',
              name: _tPl('platnosci.planFamilyYearlyName', 'Rodzinny roczny'),
              period: _tPl('platnosci.periodYearly', 'rok'),
              sub: _tPl('platnosci.subFamilyYearlyDesc', '6 kont · 2 miesiące gratis'),
              priceBase: '239,99 zł', priceApple: '479,99 zł',
              badge: _tPl('platnosci.badgeBest', 'Najlepszy') },
        ]
    };
}

let currentTab      = 'individual';
let selectedPlanId  = 'sub_individual_yearly'; // domyślnie
let isApple         = false;
let isPL            = false;

/* ── Detekcja kraju/platformy ── */
function detectContext() {
    isPL = navigator.language?.startsWith('pl') || false;
    isApple = /iPhone|iPad|iPod|Mac/.test(navigator.userAgent);

    if (isPL) {
        document.querySelectorAll('.pl-only').forEach(el => el.style.display = 'flex');
    }
}

/* ── Renderuj karty ── */
function renderCards() {
    const plans = getPLANS()[currentTab];
    const container = document.getElementById('pay-cards');
    container.innerHTML = '';

    plans.forEach(plan => {
        const isSelected = plan.id === selectedPlanId;
        const price = isApple ? plan.priceApple : plan.priceBase;
        const badgeHtml = plan.badge
            ? `<span class="pay-badge ${plan.badge === 'Polecane' ? 'popular' : ''}">${plan.badge}</span>`
            : '';

        const card = document.createElement('div');
        card.className = 'pay-card' + (isSelected ? ' selected' : '');
        card.innerHTML = `
            <div class="pay-card-radio"></div>
            <div class="pay-card-info">
                <div class="pay-card-name">${plan.name} ${badgeHtml}</div>
                <div class="pay-card-sub">${plan.sub}</div>
            </div>
            <div class="pay-card-price">
                <div class="pay-card-amount">${price}</div>
                <div class="pay-card-period">/ ${plan.period}</div>
            </div>
        `;
        card.addEventListener('click', () => selectPlan(plan.id));
        container.appendChild(card);
    });

    updateFooter();
}

function selectPlan(planId) {
    selectedPlanId = planId;
    renderCards();
}

function setTab(tab) {
    currentTab = tab;
    // Wybierz domyślnie roczny dla każdego taba
    selectedPlanId = tab === 'individual' ? 'sub_individual_yearly' : 'sub_family_yearly';
    document.getElementById('tab-ind').classList.toggle('active', tab === 'individual');
    document.getElementById('tab-fam').classList.toggle('active', tab === 'family');
    renderCards();
}

/* ── Stopka z podsumowaniem ── */
function updateFooter() {
    const allPlans = [...getPLANS().individual, ...getPLANS().family];
    const plan = allPlans.find(p => p.id === selectedPlanId);
    if (!plan) return;
    const price = isApple ? plan.priceApple : plan.priceBase;
    document.getElementById('pay-footer').textContent =
        typeof t === 'function'
            ? t('platnosci.payingComingBody')
            : `Wybrany: ${plan.name} — ${price} / ${plan.period}. Anuluj w dowolnym momencie.`;
}

/* ── Obsługa płatności ── */
function payWith(provider) {
    if (!selectedPlanId) {
        alert(typeof t === 'function' ? t('platnosci.pickPlanFirstHint') : 'Wybierz pakiet przed kontynuowaniem.');
        return;
    }

    const allPlans = [...getPLANS().individual, ...getPLANS().family];
    const plan = allPlans.find(p => p.id === selectedPlanId);

    // TODO: implementacja webhooków płatności
    alert(typeof t === 'function' ? t('platnosci.payingComingBody') : 'Płatności w appce wkrótce — na razie zarządzaj subskrypcją na stronie coachay.com.');
}

function goBack() {
    if (document.referrer) {
        history.back();
    } else {
        window.location.href = REDIRECT;
    }
}

/* ── Init ── */
detectContext();
if (typeof onI18nReady === 'function') {
    onI18nReady(() => renderCards());
} else {
    renderCards();
}
</script>
</body>
</html>
