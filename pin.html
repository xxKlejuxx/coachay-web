<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COACHAY — PIN</title>
<link rel="stylesheet" href="_global.css?v=20260730a">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
:root { --phone-h: 750px; }

.screen-body {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 32px 24px; gap: 0; overflow: hidden;
}

/* ── Logo ── */
.pin-logo {
    margin-bottom: 48px; text-align: center;
    animation: fadeUp 0.5s 0.05s cubic-bezier(0.16,1,0.3,1) both;
}
.pin-logo-name {
    font-family: var(--font-d); font-size: 28px; font-weight: 800;
    color: var(--bialy); letter-spacing: 4px;
}
.pin-logo-sub { font-size: 11px; font-weight: 600; color: var(--szary); margin-top: 3px; }

/* ── Tytuł ── */
.pin-title {
    font-family: var(--font-d); font-size: 18px; font-weight: 800;
    color: var(--bialy); text-align: center; margin-bottom: 6px;
    animation: fadeUp 0.5s 0.1s cubic-bezier(0.16,1,0.3,1) both;
}
.pin-subtitle {
    font-size: 13px; font-weight: 600; color: var(--szary);
    text-align: center; margin-bottom: 32px; min-height: 20px;
    animation: fadeUp 0.5s 0.13s cubic-bezier(0.16,1,0.3,1) both;
}

/* ── Dots ── */
.pin-dots {
    display: flex; gap: 16px; margin-bottom: 10px;
    animation: fadeUp 0.5s 0.16s cubic-bezier(0.16,1,0.3,1) both;
}
.pin-dot {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid var(--border2); background: transparent;
    transition: background 0.15s, border-color 0.15s;
}
.pin-dot.filled { background: var(--akcent); border-color: var(--akcent); }
.pin-dot.error  { background: var(--blad);  border-color: var(--blad); }

.pin-dots.shake { animation: pinShake 0.4s ease; }
@keyframes pinShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
}

.pin-error {
    font-size: 12px; font-weight: 700; color: var(--blad);
    text-align: center; min-height: 18px; margin-bottom: 20px;
}

/* ── Klawiatura ── */
.pin-keypad {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px; width: 100%; max-width: 270px; margin-bottom: 20px;
    animation: fadeUp 0.5s 0.2s cubic-bezier(0.16,1,0.3,1) both;
}
.pin-key {
    aspect-ratio: 1; border-radius: 50%;
    border: 1px solid var(--border2); background: var(--tlo-karta);
    color: var(--bialy); font-family: var(--font); font-size: 22px; font-weight: 800;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.1s; user-select: none;
}
.pin-key:active { background: var(--tlo-karta2); }
.pin-key.empty  { border: none; background: none; pointer-events: none; }
.pin-key.back   { font-size: 16px; color: var(--szary-j); }
.pin-key.zero   { grid-column: 2; }

.pin-forgot {
    font-size: 13px; font-weight: 700; color: var(--szary); cursor: pointer;
    text-align: center; padding: 8px;
    animation: fadeUp 0.5s 0.25s cubic-bezier(0.16,1,0.3,1) both;
}
.pin-forgot:active { color: var(--bialy); }

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<div class="phone">
    <div class="notch"></div>
    <div class="screen-body">

        <div class="pin-logo">
            <div class="pin-logo-name">COACHAY</div>
            <div class="pin-logo-sub">Platforma dla trenerów i drużyn</div>
        </div>

        <div class="pin-title" id="pin-title">Ustaw PIN</div>
        <div class="pin-subtitle" id="pin-subtitle">Wpisz 4-cyfrowy PIN</div>

        <div class="pin-dots" id="pin-dots">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
        </div>
        <div class="pin-error" id="pin-error"></div>

        <div class="pin-keypad">
            <div class="pin-key" onclick="pressKey('1')">1</div>
            <div class="pin-key" onclick="pressKey('2')">2</div>
            <div class="pin-key" onclick="pressKey('3')">3</div>
            <div class="pin-key" onclick="pressKey('4')">4</div>
            <div class="pin-key" onclick="pressKey('5')">5</div>
            <div class="pin-key" onclick="pressKey('6')">6</div>
            <div class="pin-key" onclick="pressKey('7')">7</div>
            <div class="pin-key" onclick="pressKey('8')">8</div>
            <div class="pin-key" onclick="pressKey('9')">9</div>
            <div class="pin-key empty"></div>
            <div class="pin-key zero" onclick="pressKey('0')">0</div>
            <div class="pin-key back" onclick="pressBackspace()">⌫</div>
        </div>

        <div class="pin-forgot" id="pin-forgot" style="display:none;" onclick="forgotPin()">Nie pamiętam PINu</div>

    </div>
</div>

<script src="coachay-core.js?v=20260730a"></script>
<script>
/* ═══════════════════════════════
   PIN.HTML — blokada / ustawianie
   v1.1 | 2026-04-11
═══════════════════════════════ */

const params  = new URLSearchParams(window.location.search);
const MODE    = params.get('mode') || 'unlock';
const RETURN  = localStorage.getItem('pinReturnUrl') || 'start.html';

let pinBuffer  = '';
let setupStep  = 1;
let setupFirst = '';

async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ── UI ── */
function updateDots() {
    for (let i = 0; i < 4; i++) {
        document.getElementById(`dot-${i}`).classList.toggle('filled', i < pinBuffer.length);
        document.getElementById(`dot-${i}`).classList.remove('error');
    }
}

function setError(msg) {
    const dots = document.getElementById('pin-dots');
    for (let i = 0; i < 4; i++) document.getElementById(`dot-${i}`).classList.add('error');
    dots.classList.add('shake');
    document.getElementById('pin-error').textContent = msg;
    setTimeout(() => {
        dots.classList.remove('shake');
        for (let i = 0; i < 4; i++) document.getElementById(`dot-${i}`).classList.remove('error');
        pinBuffer = '';
        updateDots();
    }, 500);
}

/* ── Klawiatura ── */
function pressKey(digit) {
    if (pinBuffer.length >= 4) return;
    document.getElementById('pin-error').textContent = '';
    pinBuffer += digit;
    updateDots();
    if (pinBuffer.length === 4) setTimeout(handleComplete, 120);
}

function pressBackspace() {
    if (pinBuffer.length === 0) return;
    pinBuffer = pinBuffer.slice(0, -1);
    document.getElementById('pin-error').textContent = '';
    updateDots();
}

/* ── Po wpisaniu 4 cyfr ── */
async function handleComplete() {
    if (MODE === 'setup') await handleSetup();
    else await handleUnlock();
}

/* ── SETUP ── */
async function handleSetup() {
    if (setupStep === 1) {
        setupFirst = pinBuffer;
        pinBuffer = '';
        updateDots();
        setupStep = 2;
        document.getElementById('pin-title').textContent = 'Potwierdź PIN';
        document.getElementById('pin-subtitle').textContent = 'Wpisz PIN jeszcze raz';
    } else {
        if (pinBuffer !== setupFirst) {
            setError('PINy nie są zgodne — spróbuj ponownie');
            setupStep = 1;
            setupFirst = '';
            setTimeout(() => {
                document.getElementById('pin-title').textContent = 'Ustaw PIN';
                document.getElementById('pin-subtitle').textContent = 'Wpisz 4-cyfrowy PIN';
            }, 550);
            return;
        }
        try {
            const hash = await sha256(pinBuffer);
            await db.collection('users').doc(getCurrentUserId()).update({ pinHash: hash });
            localStorage.setItem('appLastActive', Date.now().toString());
            window.location.replace('start.html');
        } catch(e) {
            console.error('Błąd zapisu PIN:', e);
            setError('Błąd zapisu — spróbuj ponownie');
        }
    }
}

/* ── UNLOCK ── */
async function handleUnlock() {
    try {
        const userDoc = await db.collection('users').doc(getCurrentUserId()).get();
        const inputHash = await sha256(pinBuffer);
        if (inputHash === userDoc.data()?.pinHash) {
            localStorage.setItem('appLastActive', Date.now().toString());
            window.location.replace(RETURN);
        } else {
            setError('Nieprawidłowy PIN');
        }
    } catch(e) {
        console.error('Błąd weryfikacji PIN:', e);
        setError('Błąd weryfikacji — spróbuj ponownie');
    }
}

/* ── Forgot PIN ── */
async function forgotPin() {
    if (!await showConfirmSheet('Resetowanie PINu wymaga wylogowania. Kontynuować?')) return;
    try {
        const userId = getCurrentUserId();
        if (userId) await db.collection('users').doc(userId).update({ pinHash: firebase.firestore.FieldValue.delete() });
    } catch(e) { console.warn('forgotPin:', e); }
    localStorage.removeItem('appLastActive');
    localStorage.removeItem('pinReturnUrl');
    await auth.signOut();
    window.location.replace('login.html');
}

/* ── Init ── */
window.addEventListener('DOMContentLoaded', () => {
    if (typeof firebase === 'undefined') { console.error('❌ Firebase!'); return; }
    initFirebase();

    if (MODE === 'unlock') {
        document.getElementById('pin-title').textContent = 'Wpisz PIN';
        document.getElementById('pin-subtitle').textContent = '';
        document.getElementById('pin-forgot').style.display = 'block';
    }
});

document.addEventListener('keydown', e => {
    if (e.key >= '0' && e.key <= '9') pressKey(e.key);
    if (e.key === 'Backspace') pressBackspace();
});
</script>
</body>
</html>
