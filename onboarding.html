<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COACHAY — Jak zacząć</title>
<link rel="stylesheet" href="_global.css">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="coachay-core.js"></script>
<style>
/* ═══════════════════════════════════════════════════
   ONBOARDING — makieta realnych ekranów + numerowane podpowiedzi.
   Fragmenty HTML/CSS niżej są kopiami realnych komponentów
   (start.html, klub.html, druzyna.html, kalendarz.html, ustawienia.html) —
   jeśli zmienisz tam styl/kolor, ten plik automatycznie się zaktualizuje
   (współdzielony _global.css). Strukturę trzeba poprawić ręcznie tylko
   jeśli zmieni się LAYOUT któregoś ekranu.

   Układ to 3 osobne strefy flex (góra=makieta, środek=legenda, dół=nawigacja
   tury) — żadna nie nakłada się na drugą. Wewnątrz makiety ekranu też są
   3 strefy (top-bar / treść / dolne menu appki), analogicznie.
   Znaczniki (mark) są przyklejone do konkretnego elementu (.hotspot,
   position:relative + mark position:absolute w rogu), nie zgadywane
   względem całego ekranu — dzięki temu nie rozjeżdżają się przy zmianach.
═══════════════════════════════════════════════════ */

/* .phone/.notch — te same klasy co reszta appki (_global.css), dzięki czemu
   native-app w Capacitorze poprawnie chowa ramkę telefonu (patrz coachay-core.js) */

.onb-topline { padding: 14px 20px 0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.onb-eyebrow { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--akcent); }
.onb-skip { font-size: 11px; font-weight: 700; color: var(--szary); cursor: pointer; }

.onb-dots { display: flex; gap: 6px; padding: 10px 20px 0; flex-shrink: 0; }
.onb-dot { height: 4px; flex: 1; border-radius: 2px; background: var(--border2); }
.onb-dot.done { background: var(--akcent); }

/* Strefa 1 — makieta ekranu (jedyna, która może przewijać się w pionie) */
.onb-mockup { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; margin-top: 10px; }

/* Strefa 2 — legenda (opis punktów), zawsze pod makietą, nigdy na niej */
.onb-legend {
    flex-shrink: 0;
    margin: 8px 16px 0;
    background: rgba(22,22,22,0.75);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border2);
    border-radius: 14px;
    padding: 10px 14px;
    display: flex; flex-direction: column; gap: 7px;
}
.legend-row { display: flex; align-items: center; gap: 8px; }
.legend-num { width: 16px; height: 16px; border-radius: 50%; background: var(--akcent); color: #fff; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: var(--font-d); }
.legend-txt { font-size: 12px; font-weight: 700; color: var(--bialy); }

/* Strefa 3 — Dalej/Wstecz */
.onb-nav { display: flex; gap: 10px; padding: 10px 16px 16px; flex-shrink: 0; }
.onb-btn { flex: 1; padding: 13px; border-radius: 12px; font-size: 13px; font-weight: 800; font-family: var(--font); border: none; cursor: pointer; }
.onb-btn:focus-visible { outline: 2px solid var(--akcent); outline-offset: 2px; }
.onb-btn-back { background: var(--tlo-karta2); color: var(--szary-j); flex: 0 0 auto; padding: 13px 18px; }
.onb-btn-next { background: var(--akcent); color: #fff; }

/* ── Znacznik przyklejony do elementu ── */
.hotspot { position: relative; }
.mark {
    position: absolute;
    top: 4px; right: 4px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--akcent);
    color: #fff;
    font-family: var(--font-d);
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px var(--tlo), 0 2px 8px rgba(0,0,0,0.5);
    z-index: 5;
    animation: markPulse 2s ease-in-out infinite;
}
@keyframes markPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}
@media (prefers-reduced-motion: reduce) { .mark { animation: none; } }

/* ── Wnętrze makiety — te same 3 strefy co prawdziwe ekrany appki ── */
.scr-body { display: flex; flex-direction: column; min-height: 100%; }
.mini-topbar { flex-shrink: 0; height: 54px; background: #000; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px 10px; border-bottom: 1px solid var(--border); }
.mini-ctx { display: flex; align-items: center; gap: 6px; background: var(--tlo-karta); border: 1px solid var(--border2); border-radius: var(--r-pill); padding: 6px 10px 6px 7px; }
.mini-ctx-dot { width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg,#3B82F6,#1D4ED8); display: flex; align-items: center; justify-content: center; font-family: var(--font-d); font-size: 8px; font-weight: 800; color: #fff; }
.mini-ctx-text { display: flex; flex-direction: column; }
.mini-ctx-klub { font-size: 9px; color: var(--szary); font-weight: 700; line-height: 1; }
.mini-ctx-team { font-size: 12px; font-weight: 800; color: var(--bialy); }
.mini-topbar-right { display: flex; gap: 6px; }
.mini-icon-btn { width: 34px; height: 34px; background: var(--tlo-karta); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }

.scr-content { flex-shrink: 0; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

.mecz-card { background: var(--bialy); border-radius: var(--r); padding: 14px 16px; color: #000; position: relative; overflow: hidden; }
.mecz-card-bg { position: absolute; right: -6px; bottom: -10px; font-size: 56px; opacity: 0.06; }
.mc-tytul { font-size: 15px; font-weight: 800; }
.mc-info { font-size: 11px; font-weight: 700; color: #777; margin-top: 2px; }
.mc-status-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.mc-status-badge { font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: rgba(248,113,113,0.15); color: #DC2626; }
.mc-action-btn { padding: 5px 14px; border-radius: 999px; font-size: 10px; font-weight: 900; border: 1px solid; margin-left: auto; background: rgba(59,130,246,0.12); border-color: rgba(59,130,246,0.25); color: #3B82F6; }
.mc-btn-claim { margin-left: auto; }

.ev-card { background: var(--tlo-karta); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
.ev-tytul { font-size: 13px; font-weight: 800; color: var(--bialy); }
.ev-info { font-size: 11px; color: var(--szary); margin-top: 2px; font-weight: 600; }
.ev-att-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.ev-att-player { font-size: 12px; font-weight: 800; color: var(--txt-primary); margin-bottom: 4px; }
.ev-att-btns { display: flex; gap: 8px; }
.ev-att-btns button { flex: 1; padding: 7px; border-radius: 999px; font-size: 11px; font-weight: 900; border: 1px solid; }
.ev-btn-yes { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.25); color: #16A34A; }
.ev-btn-no { background: rgba(248,113,113,0.10); border-color: rgba(248,113,113,0.20); color: #DC2626; }

.sec-hdr { display: flex; align-items: center; justify-content: space-between; }
.s-label { font-size: 10px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; color: var(--szary); }
.sec-more { font-size: 11px; font-weight: 800; color: var(--akcent); }
.task-item { background: var(--tlo-karta); border: 1px solid var(--border); border-left: 3px solid var(--akcent); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.task-check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border2); background: var(--tlo-karta2); flex-shrink: 0; }
.task-text { font-size: 13px; font-weight: 700; color: var(--txt-primary); }
.task-meta { font-size: 11px; color: var(--szary); margin-top: 2px; font-weight: 600; }

.mini-bottomnav { flex-shrink: 0; margin-top: auto; height: 58px; background: rgba(8,8,8,0.98); border-top: 1px solid var(--border); display: flex; align-items: center; padding: 0 6px; }
.mini-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.mini-nav-icon { font-size: 18px; }
.mini-nav-label { font-size: 9px; font-weight: 800; color: var(--szary); }
.mini-nav-item.active .mini-nav-icon { font-size: 22px; }
.mini-nav-item.active .mini-nav-label { color: var(--bialy); }
.mini-nav-bubble { width: 38px; height: 38px; border-radius: 12px; background: var(--bialy); display: flex; align-items: center; justify-content: center; font-size: 18px; }

/* ── Screen: KLUB ── */
.team-card { background: var(--tlo-karta); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.team-card-icon { width: 40px; height: 40px; border-radius: 10px; background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.2); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.team-card-name { font-size: 14px; font-weight: 800; color: var(--bialy); }
.team-card-coach { font-size: 12px; color: var(--szary-j); font-weight: 600; margin-top: 2px; }
.team-card-arrow { color: var(--border2); font-size: 16px; margin-left: auto; }
.mini-fab-wide { align-self: flex-end; padding: 0 18px; height: 44px; background: var(--akcent); border-radius: 999px; color: #fff; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 16px rgba(59,130,246,0.4); }

/* ── Screen: DRUŻYNA ── */
.zaw-item { background: var(--tlo-karta); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.zaw-av-wrap { position: relative; flex-shrink: 0; width: 44px; height: 44px; }
.zaw-av { width: 44px; height: 44px; border-radius: 50%; background: var(--tlo-karta2); border: 2px solid var(--border2); display: flex; align-items: center; justify-content: center; }
.zaw-av-initials { font-family: var(--font-d); font-size: 13px; font-weight: 800; color: var(--bialy); }
.zaw-av-dot { position: absolute; bottom: 0; right: 0; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--tlo-karta); background: #22c55e; }
.zaw-nazwa { font-size: 14px; font-weight: 800; color: var(--bialy); }
.zaw-sub { font-size: 11px; color: var(--szary); margin-top: 2px; font-weight: 600; }
.mini-fab-round { align-self: flex-end; width: 46px; height: 46px; border-radius: 50%; background: var(--akcent); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 300; color: #fff; box-shadow: 0 4px 16px rgba(59,130,246,0.4); }
.kod-card { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
.kod-txt { font-size: 12px; font-weight: 700; color: var(--szary-j); }
.kod-val { font-family: var(--font-d); font-size: 15px; font-weight: 800; color: var(--akcent); letter-spacing: 1px; }

/* ── Screen: KALENDARZ ── */
.cal-day-names { display: grid; grid-template-columns: repeat(7,1fr); }
.cal-day-name { text-align: center; font-size: 9px; color: var(--szary); font-weight: 900; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 1px; }
.cal-cell { height: 30px; display: flex; align-items: center; justify-content: center; }
.cal-cell-num { font-size: 12px; font-weight: 700; color: var(--szary-j); }
.cal-cell.today .cal-cell-num { background: var(--akcent); color: #fff; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-lbl { font-size: 9px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; color: var(--szary); }
.form-inp { width: 100%; background: var(--tlo-karta); border: 1.5px solid var(--border2); border-radius: 12px; padding: 10px 12px; color: var(--bialy); font-size: 13px; font-weight: 600; box-sizing: border-box; }

/* ── Screen: USTAWIENIA ── */
.sg-label { font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--szary); }
.si { background: var(--tlo-karta); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; }
.si-icon { font-size: 17px; width: 24px; text-align: center; flex-shrink: 0; }
.si-text { font-size: 14px; font-weight: 700; color: var(--bialy); }
.si-desc { font-size: 11px; color: var(--szary); font-weight: 600; margin-top: 2px; }
.si-arr { color: var(--border2); font-size: 14px; margin-left: auto; }

.faded { opacity: 0.35; }
</style>
</head>
<body>

<div class="phone">
    <div class="notch"></div>
    <div class="onb-topline">
        <div class="onb-eyebrow" id="onb-eyebrow">Krok 1</div>
        <span class="onb-skip" onclick="skipOnboarding()">Pomiń ✕</span>
    </div>
    <div class="onb-dots" id="onb-dots"></div>
    <div class="onb-mockup" id="onb-mockup"></div>
    <div class="onb-legend" id="onb-legend"></div>
    <div class="onb-nav">
        <button class="onb-btn onb-btn-back" id="onb-back" onclick="prevStep()">← Wstecz</button>
        <button class="onb-btn onb-btn-next" id="onb-next" onclick="nextStep()">Dalej →</button>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════
   KONFIG — jedno miejsce do dodawania/zmiany kroków.
   ekran: klucz szablonu (patrz SCREEN_TEMPLATES niżej)
   punkty: klucze hotspotów tego ekranu, w kolejności numeracji.
   Dodanie kroku = nowy wpis tutaj, nic więcej.
═══════════════════════════════════════════════════ */
const ONBOARDING_STEPS = {
    TRENER_GLOWNY: [
        { ekran: 'start',       punkty: ['kontekst', 'mecz', 'nav'] },
        { ekran: 'klub',        punkty: ['druzyny'] },
        { ekran: 'druzyna',     punkty: ['dodaj', 'kod'] },
        { ekran: 'kalendarz',   punkty: ['utworz', 'przypomnij'] },
        { ekran: 'ustawienia',  punkty: ['sezon'] }
    ],
    TRENER_POMOCNICZY: [
        { ekran: 'start',       punkty: ['kontekst', 'mecz', 'nav'] },
        { ekran: 'klub',        punkty: ['druzyny'] },
        { ekran: 'druzyna',     punkty: ['dodaj', 'kod'] },
        { ekran: 'kalendarz',   punkty: ['utworz', 'przypomnij'] },
        { ekran: 'ustawienia',  punkty: ['sezon'] }
    ],
    RODZIC: [
        { ekran: 'start',   punkty: ['dziecko', 'mecz', 'obecnosc', 'zadania'] },
        { ekran: 'druzyna', punkty: ['profil'] }
    ],
    KIBIC: [
        { ekran: 'start', punkty: ['mecz', 'nav'] }
    ]
};

/* Podpisy do legendy — klucz hotspotu -> tekst */
const CAPTIONS = {
    kontekst:  'Zmień drużynę / klub',
    mecz:      { trener: 'Przejmij obsługę meczu na żywo', rodzic: 'Sprawdź wynik lub obsłuż mecz na żywo', kibic: 'Sprawdź wynik meczu na żywo' },
    nav:       'Menu główne — Drużyna, Mecz, Czat, Kalendarz',
    druzyny:   'Tu zakładasz i dodajesz drużyny',
    dodaj:     'Dodaj nowego zawodnika',
    kod:       'Wygeneruj kod zaproszenia dla rodzica/zawodnika',
    utworz:    'Utwórz trening lub mecz',
    przypomnij:'Ustaw ile dni wcześniej appka przypomni o evencie',
    sezon:     'Ustaw daty sezonu — bez tego statystyki obecności nie działają',
    dziecko:   'Drużyna i profil zawodnika',
    obecnosc:  'Potwierdź lub odrzuć obecność zawodnika',
    zadania:   'Zadania do wykonania',
    profil:    'Frekwencja i statystyki dziecka'
};

/* ── Szablony ekranów — realne fragmenty HTML kopiowane z appki.
   mark(key) wstawia numerowany znacznik TYLKO jeśli klucz jest aktywny
   w bieżącym kroku — przyklejony bezpośrednio do elementu, nie do całego ekranu. ── */
function buildMarker(activePunkty, key) {
    const idx = activePunkty.indexOf(key);
    if (idx === -1) return '';
    return `<div class="mark">${idx + 1}</div>`;
}

const SCREEN_TEMPLATES = {
    start: (ctx, punkty) => { const mark = k => buildMarker(punkty, k); return `
        <div class="scr-body">
            <div class="mini-topbar">
                <div class="hotspot mini-ctx">${mark('kontekst')}<div class="mini-ctx-dot">O</div><div class="mini-ctx-text"><span class="mini-ctx-klub">Orły Praga</span><span class="mini-ctx-team">Orły U10</span></div></div>
                <div class="mini-topbar-right"><div class="mini-icon-btn">🔔</div><div class="mini-icon-btn">☰</div></div>
            </div>
            <div class="scr-content">
                <div class="hotspot mecz-card">${mark('mecz')}
                    <div class="mecz-card-bg">⚽</div>
                    <div class="mc-tytul">Orły U10 vs Barca</div>
                    <div class="mc-info">📍 Boisko Orły · 🕐 dziś, 17:00</div>
                    <div class="mc-status-row"><span class="mc-status-badge">na żywo</span>${ctx === 'trener' ? '<button class="mc-action-btn">🔄 Przejmij obsługę</button>' : ctx === 'rodzic' ? '<button class="mc-action-btn mc-btn-claim">📋 Obsługuję mecz</button>' : ''}</div>
                </div>
                ${ctx === 'rodzic' ? `
                <div class="ev-card">
                    <div class="ev-tytul">Trening kondycyjny</div>
                    <div class="ev-info">🕐 jutro, 17:00</div>
                    <div class="ev-att-row">
                        <div class="ev-att-player">Kuba Kowalski</div>
                        <div class="hotspot ev-att-btns">${mark('obecnosc')}<button class="ev-btn-yes">✅ Będzie</button><button class="ev-btn-no">❌ Nie będzie</button></div>
                    </div>
                </div>` : ''}
                <div>
                    <div class="sec-hdr"><span class="s-label">Zadania</span><span class="sec-more">Wszystkie ›</span></div>
                    <div class="hotspot task-item" style="margin-top:8px;">${mark('zadania')}<div class="task-check"></div><div><div class="task-text">Przynieś strój na mecz</div><div class="task-meta">termin: jutro</div></div></div>
                </div>
            </div>
            <div class="hotspot mini-bottomnav">${mark('nav')}
                <div class="mini-nav-item active"><span class="mini-nav-icon">🏠</span><span class="mini-nav-label">Start</span></div>
                <div class="hotspot mini-nav-item">${mark('dziecko')}<span class="mini-nav-icon">👥</span><span class="mini-nav-label">Drużyna</span></div>
                <div class="mini-nav-item"><div class="mini-nav-bubble">🏆</div></div>
                <div class="mini-nav-item"><span class="mini-nav-icon">💬</span><span class="mini-nav-label">Czat</span></div>
                <div class="mini-nav-item"><span class="mini-nav-icon">📅</span><span class="mini-nav-label">Kalendarz</span></div>
            </div>
        </div>`; },

    klub: (ctx, punkty) => { const mark = k => buildMarker(punkty, k); return `
        <div class="scr-body">
            <div class="mini-topbar"><div class="mini-ctx"><div class="mini-ctx-dot">O</div><div class="mini-ctx-text"><span class="mini-ctx-klub">Klub</span><span class="mini-ctx-team">Orły Praga</span></div></div><div class="mini-topbar-right"><div class="mini-icon-btn">☰</div></div></div>
            <div class="scr-content">
                <div class="hotspot team-card">${mark('druzyny')}<div class="team-card-icon">🏟️</div><div><div class="team-card-name">Orły U10</div><div class="team-card-coach">🎽 Jan Kowalski ★</div></div><div class="team-card-arrow">›</div></div>
                <div class="team-card faded"><div class="team-card-icon">🏟️</div><div><div class="team-card-name">Orły U12</div><div class="team-card-coach">🎽 Anna Nowak</div></div><div class="team-card-arrow">›</div></div>
                <div class="mini-fab-wide">＋ Dodaj drużynę</div>
            </div>
            <div class="mini-bottomnav">
                <div class="mini-nav-item"><span class="mini-nav-icon">🏠</span><span class="mini-nav-label">Start</span></div>
                <div class="mini-nav-item active"><span class="mini-nav-icon">👥</span><span class="mini-nav-label">Drużyna</span></div>
                <div class="mini-nav-item"><div class="mini-nav-bubble">🏆</div></div>
                <div class="mini-nav-item"><span class="mini-nav-icon">💬</span><span class="mini-nav-label">Czat</span></div>
                <div class="mini-nav-item"><span class="mini-nav-icon">📅</span><span class="mini-nav-label">Kalendarz</span></div>
            </div>
        </div>`; },

    druzyna: (ctx, punkty) => { const mark = k => buildMarker(punkty, k); return `
        <div class="scr-body">

/* ── Logika tury ── */
let currentSteps = [];
let currentIndex = 0;

function renderStep() {
    const step = currentSteps[currentIndex];
    const ctx = window._onbRole === 'RODZIC' ? 'rodzic' : window._onbRole === 'KIBIC' ? 'kibic' : 'trener';
    document.getElementById('onb-mockup').innerHTML = SCREEN_TEMPLATES[step.ekran](ctx, step.punkty);

    document.getElementById('onb-legend').innerHTML = step.punkty
        .map((key, i) => {
            const raw = CAPTIONS[key] || key;
            const txt = typeof raw === 'object' ? (raw[ctx] || raw.trener) : raw;
            return `<div class="legend-row"><span class="legend-num">${i + 1}</span><span class="legend-txt">${txt}</span></div>`;
        })
        .join('');

    document.getElementById('onb-eyebrow').textContent = `Krok ${currentIndex + 1} z ${currentSteps.length}`;
    document.getElementById('onb-dots').innerHTML = currentSteps.map((_, i) => `<div class="onb-dot${i <= currentIndex ? ' done' : ''}"></div>`).join('');
    document.getElementById('onb-back').style.visibility = currentIndex === 0 ? 'hidden' : 'visible';
    document.getElementById('onb-next').textContent = currentIndex === currentSteps.length - 1 ? 'Zakończ' : 'Dalej →';
}

function nextStep() {
    if (currentIndex < currentSteps.length - 1) {
        currentIndex++;
        renderStep();
    } else {
        finishOnboarding();
    }
}

function prevStep() {
    if (currentIndex > 0) {
        currentIndex--;
        renderStep();
    }
}

async function finishOnboarding() {
    await markOnboardingDone();
    window.location.href = 'start.html';
}

async function skipOnboarding() {
    await markOnboardingDone();
    window.location.href = 'start.html';
}

async function markOnboardingDone() {
    try {
        const userId = getCurrentUserId();
        if (userId && db && !isDemoMode()) {
            await db.collection('users').doc(userId).update({ onboardingDone: true });
        }
    } catch (e) { console.warn('⚠️ onboardingDone:', e); }
}

window.addEventListener('DOMContentLoaded', async () => {
    if (!requireAuth()) return;
    initFirebase();
    const s = await initSession();
    if (!s) return;
    const { membership } = s;
    const role = membership
        ? (membership.role === 'TRENER' ? (membership.trainerRole || 'TRENER_GLOWNY') : membership.role)
        : 'TRENER_GLOWNY';

    if (role === 'ZAWODNIK' || !ONBOARDING_STEPS[role]) {
        window.location.href = 'start.html';
        return;
    }

    window._onbRole = role;
    currentSteps = ONBOARDING_STEPS[role];
    currentIndex = 0;
    renderStep();
});
</script>
