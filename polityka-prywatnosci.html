<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polityka Prywatności — Coachay</title>
<link rel="stylesheet" href="_global.css?v=20260802d">
<script src="_i18n.js?v=20261003c"></script>
<style>
:root { --phone-h: unset; }
body { min-height: 100vh; background: var(--tlo); overflow-y: auto; }
.phone { max-width: 680px; min-height: unset; height: auto; border-radius: 0; border: none; box-shadow: none; }

.pp-topbar { background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; padding: 14px 20px; }
.pp-back { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--r-pill); background: var(--tlo-karta); border: 1px solid var(--border2); color: var(--szary-j); font-size: 13px; font-weight: 800; cursor: pointer; text-decoration: none; }
.pp-back:active { opacity: 0.7; }
.pp-logo { font-family: var(--font-d); font-size: 18px; font-weight: 900; color: var(--bialy); letter-spacing: 3px; margin-left: auto; }

.pp-wrap { padding: 24px 20px 80px; display: flex; flex-direction: column; gap: 20px; }

.pp-hero { padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.pp-eyebrow { font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--szary); margin-bottom: 10px; }
.pp-title { font-family: var(--font-d); font-size: 26px; font-weight: 800; color: var(--bialy); margin: 0 0 10px; line-height: 1.2; }
.pp-intro { font-size: 13px; color: var(--szary-j); font-weight: 600; line-height: 1.75; }

.pp-section { background: var(--tlo-karta); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
.pp-section-title { font-family: var(--font-d); font-size: 13px; font-weight: 900; color: var(--bialy); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
.pp-section-text { font-size: 13px; font-weight: 600; color: var(--szary-j); line-height: 1.7; margin-bottom: 8px; white-space: pre-line; }
.pp-section-text:last-child { margin-bottom: 0; }
.pp-section-text strong { color: var(--bialy); }

.pp-footer { padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 12px; color: var(--szary); font-weight: 600; line-height: 1.8; }
.pp-footer a { color: var(--szary); text-decoration: none; }
.pp-footer a:hover { color: var(--szary-j); }
</style>
</head>
<body>
<div class="phone">

    <div class="pp-topbar">
        <a class="pp-back" id="pp-back-btn" href="https://coachay.com">← Wróć</a>
        <span class="pp-logo">COACHAY</span>
    </div>

    <div class="pp-wrap">

        <div class="pp-hero">
            <div class="pp-eyebrow" data-i18n="polityka.eyebrow">Ochrona danych osobowych</div>
            <h1 class="pp-title" data-i18n="polityka.headerTitle">Polityka Prywatności</h1>
            <p class="pp-intro" data-i18n="polityka.intro">Serwisu i aplikacji COACHAY (coachay.com) oraz zasady ochrony danych osobowych.</p>
        </div>

        <div id="pp-sections"></div>

        <div class="pp-footer">
            <span data-i18n="polityka.footer">© 2026 Coachay. Wszelkie prawa zastrzeżone.</span><br>
            Coachay — NIP 771-222-88-03 — <a href="mailto:support@coachay.com">support@coachay.com</a><br>
            <a href="rodo2.html" id="pp-f-rodo2" data-i18n="polityka.footerRodo2">Usunięcie konta i danych (RODO)</a>
        </div>

    </div>
</div>

<script>
function renderPolitykaSections() {
    const container = document.getElementById('pp-sections');
    if (!container) return;
    const sections = typeof t === 'function' ? t('polityka.sections') : null;
    if (!Array.isArray(sections) || !sections.length) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = sections.map(s => `
        <div class="pp-section">
            <div class="pp-section-title">${s.title || ''}</div>
            <div class="pp-section-text">${(s.body || '').replace(/\n/g, '<br>')}</div>
        </div>`).join('');
}

function renderPolityka() {
    const back = document.getElementById('pp-back-btn');
    if (back && typeof t === 'function') {
        const v = t('polityka.back');
        if (v && v !== 'polityka.back') back.textContent = v;
    }
    renderPolitykaSections();
}

if (typeof onI18nReady === 'function') {
    onI18nReady(renderPolityka);
} else {
    renderPolityka();
}
</script>
</body>
</html>
