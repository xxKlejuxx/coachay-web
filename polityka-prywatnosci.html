<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polityka Prywatności — Coachay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Syne:wght@700;800&display=block">
<style>body{visibility:hidden}</style>
<script>document.fonts.ready.then(function(){document.body.style.visibility='visible'});</script>
<script src="_i18n.js?v=20261007c"></script>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

:root {
  --tlo:       #080808;
  --tlo-karta: #111111;
  --tlo-karta2:#181818;
  --border:    #1f1f1f;
  --border2:   #2a2a2a;
  --bialy:     #FFFFFF;
  --szary:     #666;
  --szary-j:   #999;
  --akcent:    #3B82F6;
  --akcent-d:  #2563EB;
  --sukces:    #22C55E;
  --font:      'Nunito', sans-serif;
  --font-d:    'Syne', sans-serif;
  --max-w:     1120px;
}

body { font-family: var(--font); background: var(--tlo); color: var(--bialy); min-height: 100vh; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
.container { max-width: var(--max-w); margin: 0 auto; padding: 0 40px; }

header { position: sticky; top: 0; z-index: 100; background: rgba(8,8,8,0.85); backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid var(--border); }
.header-inner { display: flex; align-items: center; justify-content: space-between; height: 82px; }
.logo { display: flex; flex-direction: column; gap: 4px; }
.logo-name { font-family: var(--font-d); font-size: 40px; font-weight: 800; letter-spacing: 3px; color: var(--bialy); line-height: 1; }
.logo-sub { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--szary); line-height: 1; }
.btn-back { padding: 8px 20px; background: transparent; border: 1px solid var(--border2); border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--szary-j); transition: all 0.12s; }
.btn-back:hover { border-color: rgba(255,255,255,0.2); color: var(--bialy); }

.legal-hero { padding: 56px 0 8px; }
.legal-hero h1 { font-family: var(--font-d); font-size: clamp(32px,4vw,48px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 14px; }
.legal-hero p { font-size: 16px; color: var(--szary-j); line-height: 1.65; max-width: 640px; }

.legal-wrap { max-width: 760px; margin: 0 auto; padding: 32px 0 96px; display: flex; flex-direction: column; gap: 16px; }
.legal-section { background: var(--tlo-karta); border: 1px solid var(--border); border-radius: 16px; padding: 24px 28px; }
.legal-section-title { font-family: var(--font-d); font-size: 14px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--bialy); margin-bottom: 12px; }
.legal-section-text { font-size: 16px; font-weight: 500; color: var(--szary-j); line-height: 1.75; margin-bottom: 10px; white-space: pre-line; }
.legal-section-text:last-child { margin-bottom: 0; }
.legal-section-text strong { color: var(--bialy); }

footer { border-top: 1px solid var(--border); padding: 28px 0; }
.footer-inner { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.footer-logo { font-family: var(--font-d); font-size: 14px; font-weight: 800; color: var(--szary); letter-spacing: 0.08em; }
.footer-links { display: flex; gap: 20px; }
.footer-links a { font-size: 14px; color: var(--szary); transition: color 0.12s; }
.footer-links a:hover { color: var(--bialy); }
.footer-copy { font-size: 14px; color: var(--szary); }

@media (max-width: 640px) {
  .logo-name { font-size: 24px; letter-spacing: 1px; }
  .logo-sub { display: none; }
  .legal-section { padding: 20px; }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="header-inner">
      <a href="https://coachay.com" class="logo">
        <span class="logo-name">COACHAY</span>
        <span class="logo-sub" data-i18n="splash.tagline">Platforma dla trenerów i drużyn</span>
      </a>
      <a href="https://coachay.com" class="btn-back" data-i18n="polityka.back">← Wróć</a>
    </div>
  </div>
</header>

<section class="legal-hero">
  <div class="container">
    <h1 data-i18n="polityka.headerTitle">Polityka Prywatności</h1>
    <p data-i18n="polityka.intro">Serwisu i aplikacji COACHAY (coachay.com) oraz zasady ochrony danych osobowych.</p>
  </div>
</section>

<div class="container">
  <div class="legal-wrap" id="pp-sections"></div>
</div>

<footer>
  <div class="container">
    <div class="footer-inner">
      <div class="footer-logo">COACHAY</div>
      <div class="footer-links">
        <a href="polityka-prywatnosci.html" data-i18n="landing.footerPrivacy">Polityka prywatności</a>
        <a href="rodo2.html">RODO</a>
      </div>
      <div class="footer-copy" data-i18n="polityka.footer">© 2026 Coachay. Wszelkie prawa zastrzeżone.</div>
    </div>
  </div>
</footer>


<script>
function renderPolitykaSections() {
    const container = document.getElementById('pp-sections');
    if (!container) return;
    const sections = typeof t === 'function' ? t('polityka.sections') : null;
    if (!Array.isArray(sections) || !sections.length) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = sections.map(s => `
        <div class="legal-section">
            <div class="legal-section-title">${s.title || ''}</div>
            <div class="legal-section-text">${(s.body || '').replace(/\n/g, '<br>')}</div>
        </div>`).join('');
}

function renderPolityka() {
    const back = document.querySelector('.btn-back');
    if (back && typeof t === 'function') {
        const v = t('polityka.back');
        if (v && v !== 'polityka.back') back.textContent = v;
    }
    renderPolitykaSections();
}

if (typeof onI18nReady === 'function') {
    onI18nReady(renderPolityka);
} else {
    renderPolityka();
}
</script>
</body>
</html>
