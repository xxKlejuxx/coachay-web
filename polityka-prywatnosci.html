<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COACHAY — Polityka Prywatności</title>
<link rel="stylesheet" href="_global.css?v=20260802d">
<link rel="stylesheet" href="_desktop.css?v=20260818">
<script src="_i18n.js?v=20260820"></script>
<script src="_sidebar.js?v=20260818b"></script>
<style>
:root { --phone-h: 750px; }

.screen-body { overflow-y: auto; scrollbar-width: none; }
.screen-body::-webkit-scrollbar { display: none; }

.pp-header {
    background: #000; border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
}
.pp-back {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--tlo-karta); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--bialy); cursor: pointer; flex-shrink: 0;
}
.pp-header-title {
    font-family: var(--font-d); font-size: 21px; font-weight: 800; color: var(--bialy);
}
body:has(#app-sidebar) .pp-header { display: none; }

.pp-page-title { display: none; font-family: var(--font-d); font-size: 27px; font-weight: 800; color: var(--bialy); }
body:has(#app-sidebar) .pp-page-title { display: block; }

.pp-wrap {
    align-self: center; width: min(1222px, 100%);
    padding: 16px 16px 80px;
    display: flex; flex-direction: column; gap: 12px;
}
body:has(#app-sidebar) .pp-wrap { padding: 20px 28px 80px; }

.pp-intro {
    font-size: 17px; font-weight: 600; color: var(--szary); line-height: 1.6;
    padding-bottom: 4px;
}

.pp-section {
    background: var(--tlo-karta); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px;
}
.pp-section-title {
    font-family: var(--font-d); font-size: 18px; font-weight: 800;
    color: var(--bialy); margin-bottom: 10px;
    text-transform: uppercase; letter-spacing: 0.5px;
}
.pp-section-text {
    font-size: 18px; font-weight: 600; color: var(--szary-j); line-height: 1.7;
    margin-bottom: 8px; white-space: pre-line;
}
.pp-section-text:last-child { margin-bottom: 0; }
.pp-section-text strong { color: var(--bialy); }

.pp-footer {
    font-size: 16px; font-weight: 600; color: var(--szary);
    text-align: center; padding: 12px 0 4px;
}
</style>
</head>
<body>
<div class="phone">
    <div class="notch"></div>
    <div class="screen-body">

        <div class="pp-header">
            <button class="pp-back" onclick="history.back()">←</button>
            <div class="pp-header-title" data-i18n="polityka.headerTitle">Polityka Prywatności</div>
        </div>

        <div class="pp-wrap">
            <div class="pp-page-title" data-i18n="polityka.headerTitle">Polityka Prywatności</div>
            <div class="pp-intro" data-i18n="polityka.intro">Serwisu i aplikacji COACHAY (coachay.com) oraz zasady ochrony danych osobowych.</div>
            <div id="pp-sections"></div>
            <div class="pp-footer" data-i18n="polityka.footer">© 2026 Coachay. Wszelkie prawa zastrzeżone.</div>
        </div>

    </div>

    <!-- Bottom nav -->
    <div class="bottom-nav">
        <a class="nav-item" href="start.html"><span class="nav-icon">🏠</span><span class="nav-label" data-i18n="nav.start">Start</span></a>
        <a class="nav-item" href="druzyna.html"><span class="nav-icon">👥</span><span class="nav-label" data-i18n="nav.druzyna">Drużyna</span></a>
        <a class="nav-item nav-mecz" href="mecz.html"><div class="nav-mecz-bubble">🏆</div><span class="nav-label" data-i18n="nav.mecz">Mecz</span></a>
        <a class="nav-item" href="czat.html"><span class="nav-icon">💬</span><span class="nav-label" data-i18n="nav.czat">Czat</span></a>
        <a class="nav-item" href="kalendarz.html"><span class="nav-icon">📅</span><span class="nav-label" data-i18n="nav.kalendarz">Kalendarz</span></a>
    </div>
</div>

<script>
function renderPolitykaSections() {
    const container = document.getElementById('pp-sections');
    if (!container) return;
    const sections = typeof t === 'function' ? t('polityka.sections') : null;
    if (!Array.isArray(sections) || !sections.length) {
        container.innerHTML = '';
        return;
    }
    container.innerHTML = sections.map(s => `
        <div class="pp-section">
            <div class="pp-section-title">${s.title || ''}</div>
            <div class="pp-section-text">${(s.body || '').replace(/\n/g, '<br>')}</div>
        </div>`).join('');
}

if (typeof onI18nReady === 'function') {
    onI18nReady(renderPolitykaSections);
} else {
    renderPolitykaSections();
}
</script>
</body>
</html>
