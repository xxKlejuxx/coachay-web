<script>
/* ═══════════════════════════════════════════════════
   FIREBASE - ŁADOWANIE OFERT SPARINGÓW
═══════════════════════════════════════════════════ */

async function loadSparringOffers() {
  if (!requireAuth()) return;
  
  const role = getDemoRole();
  
  // Tylko trenerzy widzą giełdę
  if (role !== 'TRENER_GLOWNY' && role !== 'TRENER_POMOCNICZY') {
    document.getElementById('offers-container').innerHTML = `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;">
        <div style="font-size:48px;opacity:0.3;margin-bottom:16px;">🔒</div>
        <div style="font-size:18px;font-weight:800;color:var(--bialy);margin-bottom:8px;">Dostęp tylko dla trenerów</div>
        <div style="font-size:13px;color:var(--szary);line-height:1.6;">Giełda sparingów jest dostępna tylko dla trenerów głównych i pomocniczych.</div>
      </div>
    `;
    return;
  }
  
  // Pobierz zespół (dla kategorii)
  const team = await getCurrentTeam();
  
  console.log('🔍 Team:', team);
  
  // Pobierz oferty (BEZ filtra - póki co pobieramy wszystkie)
  const offers = await getSparringOffers(null);
  
  console.log('🔍 Oferty z Firebase:', offers);
  
  // Renderuj oferty
  renderOffers(offers);
  
  console.log(`✅ Załadowano ${offers.length} ofert sparingów`);
}

function renderOffers(offers) {
  const container = document.getElementById('offers-container');
  if (!container) return;
  
  container.innerHTML = '';
  
  if (offers.length === 0) {
    container.innerHTML = `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;">
        <div style="font-size:48px;opacity:0.3;margin-bottom:16px;">🤝</div>
        <div style="font-size:18px;font-weight:800;color:var(--bialy);margin-bottom:8px;">Brak ofert</div>
        <div style="font-size:13px;color:var(--szary);line-height:1.6;">Nie ma jeszcze żadnych ofert sparingów w Twojej kategorii. Sprawdź później!</div>
      </div>
    `;
    return;
  }
  
  // Renderuj każdą ofertę
  offers.forEach(offer => {
    const card = createOfferCard(offer);
    container.appendChild(card);
  });
}

function createOfferCard(offer) {
  const card = document.createElement('div');
  card.style.cssText = `
    background: var(--tlo-karta);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.2s;
  `;
  
  // Ostrzeżenie
  let warningBadge = '';
  if (offer.warningLevel === 'HIGH') {
    warningBadge = `<div style="background:rgba(248,113,113,0.15);border:1px solid #F87171;border-radius:8px;padding:6px 10px;font-size:10px;font-weight:800;color:#F87171;margin-bottom:12px;">⚠️ ${offer.warningReason}</div>`;
  }
  
  // Featured badge
  let featuredBadge = '';
  if (offer.featuredBadge === 'TOP_RATED') {
    featuredBadge = `<div style="display:inline-block;background:linear-gradient(135deg,#FCD34D,#F59E0B);border-radius:6px;padding:4px 8px;font-size:9px;font-weight:900;color:#000;margin-bottom:8px;">🏆 TOP RATED</div>`;
  }
  
  // Terminy
  const datesStr = offer.dates.slice(0, 3).join(', ') + (offer.dates.length > 3 ? '...' : '');
  
  // Boisko
  let venueStr = 'Elastyczne';
  if (offer.fieldPreference === 'ONLY_OUR' && offer.venue) {
    venueStr = offer.venue.venueName;
  } else if (offer.fieldPreference === 'ONLY_AWAY') {
    venueStr = 'Tylko wyjazd';
  } else if (offer.fieldPreference === 'NEUTRAL_OR_AWAY') {
    venueStr = 'Neutralne lub wyjazd';
  }
  
  card.innerHTML = `
    ${featuredBadge}
    ${warningBadge}
    
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;">
      <div style="flex:1;">
        <div style="font-size:16px;font-weight:900;color:var(--bialy);margin-bottom:4px;">${offer.clubName}</div>
        <div style="font-size:12px;color:var(--szary);font-weight:600;">${offer.teamName} · ${offer.category}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:18px;font-weight:900;color:${offer.fairPlayRating.overall >= 4.5 ? 'var(--sukces)' : offer.fairPlayRating.overall >= 3.5 ? 'var(--warn)' : 'var(--blad)'};">⭐ ${offer.fairPlayRating.overall.toFixed(1)}</div>
        <div style="font-size:10px;color:var(--szary);font-weight:600;margin-top:2px;">${offer.distance} km</div>
      </div>
    </div>
    
    <div style="background:var(--tlo-karta2);border-radius:10px;padding:10px 12px;margin-bottom:12px;">
      <div style="font-size:10px;font-weight:900;color:var(--szary);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Terminy</div>
      <div style="font-size:12px;color:var(--bialy);font-weight:700;">${datesStr}</div>
    </div>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div>
        <div style="font-size:10px;font-weight:900;color:var(--szary);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Boisko</div>
        <div style="font-size:11px;color:var(--bialy);font-weight:700;">${venueStr}</div>
      </div>
      <div>
        <div style="font-size:10px;font-weight:900;color:var(--szary);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;">Poziom</div>
        <div style="font-size:11px;color:var(--bialy);font-weight:700;">${offer.level}</div>
      </div>
    </div>
    
    <div style="background:var(--tlo-karta2);border-radius:10px;padding:10px 12px;margin-bottom:12px;">
      <div style="font-size:10px;font-weight:900;color:var(--szary);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">Fair Play</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px;">
        <div>
          <div style="color:var(--szary);margin-bottom:2px;">⚽ Poziom</div>
          <div style="color:var(--bialy);font-weight:800;">${offer.fairPlayRating.sportLevel.toFixed(1)}/5.0</div>
        </div>
        <div>
          <div style="color:var(--szary);margin-bottom:2px;">🤝 Fair Play</div>
          <div style="color:var(--bialy);font-weight:800;">${offer.fairPlayRating.teamFairPlay.toFixed(1)}/5.0</div>
        </div>
        <div>
          <div style="color:var(--szary);margin-bottom:2px;">👥 Kibice</div>
          <div style="color:var(--bialy);font-weight:800;">${offer.fairPlayRating.fansBehavior.toFixed(1)}/5.0</div>
        </div>
      </div>
    </div>
    
    ${offer.description ? `<div style="font-size:12px;color:var(--szary-j);line-height:1.5;margin-bottom:12px;">"${offer.description}"</div>` : ''}
    
    <div style="display:flex;gap:8px;">
      <button style="flex:1;padding:10px;background:var(--bialy);color:#000;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;">Kontakt</button>
      <button style="flex:1;padding:10px;background:var(--tlo-karta2);color:var(--bialy);border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;">Szczegóły</button>
    </div>
  `;
  
  card.onclick = () => {
    console.log('Kliknięto ofertę:', offer.clubName);
    // TODO: Otwórz szczegóły oferty
  };
  
  return card;
}

// Inicjalizacja
window.addEventListener('DOMContentLoaded', () => {
    if (typeof firebase === 'undefined') { console.error('❌ Firebase!'); return; }
    initFirebase();
    let _loaded = false;
    auth.onAuthStateChanged(user => {
        if (_loaded) return;
        if (user) {
            _loaded = true;
            if (!isDemoMode() && !getCurrentUserId()) localStorage.setItem('currentUserId', user.uid);
            loadSparringOffers();
        } else {
            if (!isDemoMode()) window.location.href = 'login.html';
        }
    });
});
</script>
