<style>
.screen-body { padding: 0 !important; gap: 0 !important; display: flex; flex-direction: column; overflow: hidden !important; background: #050508; }

/* ── Top bar ── */
.ark-topbar { height: var(--top-h); background: #000; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.ark-back { display: flex; align-items: center; gap: 8px; color: var(--bialy); font-size: 13px; font-weight: 800; cursor: pointer; }
.ark-back-icon { width: 32px; height: 32px; border-radius: 50%; background: var(--tlo-karta); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.ark-topbar-title { font-family: var(--font-d); font-size: 15px; font-weight: 900; letter-spacing: 4px; color: var(--bialy); }
.ark-topbar-right { display: flex; align-items: center; gap: 12px; }
.ark-hiscore-lbl { font-size: 9px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; color: var(--szary); }
.ark-hiscore-val { font-family: var(--font-d); font-size: 14px; font-weight: 800; color: #FBBF24; }

/* ── Game area ── */
.ark-game-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.ark-hud { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 6px; background: #050508; flex-shrink: 0; }
.ark-hud-score { display: flex; align-items: baseline; gap: 6px; }
.ark-hud-lbl { font-size: 9px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--szary); }
.ark-hud-val { font-family: var(--font-d); font-size: 22px; font-weight: 800; color: var(--bialy); }
.ark-hud-level { font-family: var(--font-d); font-size: 11px; font-weight: 800; color: var(--szary); letter-spacing: 2px; }
.ark-hud-lives { display: flex; gap: 5px; align-items: center; }
.ark-life { font-size: 12px; }

.ark-canvas-wrap { flex: 1; position: relative; overflow: hidden; }
#ark-canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: none; background: #050508; }

/* ── Overlay (start / game over / level clear) ── */
.ark-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: rgba(5,5,8,0.9); transition: opacity 0.3s; z-index: 10; }
.ark-overlay.hidden { opacity: 0; pointer-events: none; }
.ark-ov-logo { font-family: var(--font-d); font-size: 28px; font-weight: 900; letter-spacing: 6px; color: var(--bialy); text-shadow: 0 0 20px rgba(59,130,246,0.6); }
.ark-ov-sub { font-size: 10px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--szary); }
.ark-ov-score-big { font-family: var(--font-d); font-size: 48px; font-weight: 800; color: #FBBF24; line-height: 1; }
.ark-ov-score-lbl { font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--szary); }
.ark-ov-level { font-family: var(--font-d); font-size: 14px; font-weight: 800; color: #22C55E; letter-spacing: 3px; }
.ark-ov-btn { margin-top: 10px; padding: 12px 32px; border-radius: var(--r-pill); background: var(--akcent); border: none; color: #fff; font-size: 12px; font-weight: 900; cursor: pointer; letter-spacing: 2px; }
.ark-ov-btn:active { opacity: 0.8; }
.ark-ov-tap { font-size: 10px; font-weight: 700; color: var(--szary); letter-spacing: 2px; animation: blink 1.2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── Inicjały (po game over) ── */
.ark-initials-section { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ark-initials-lbl { font-size: 10px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--szary); }
.ark-initials-row { display: flex; gap: 6px; }
.ark-init-input { width: 40px; height: 46px; background: rgba(255,255,255,0.08); border: 1.5px solid var(--border2); border-radius: 10px; color: var(--bialy); font-family: var(--font-d); font-size: 20px; font-weight: 900; text-align: center; text-transform: uppercase; }
.ark-init-input:focus { border-color: var(--akcent); outline: none; background: rgba(59,130,246,0.1); }
.ark-save-btn { padding: 10px 24px; border-radius: var(--r-pill); background: #22C55E; border: none; color: #000; font-size: 11px; font-weight: 900; cursor: pointer; letter-spacing: 1px; }
.ark-save-btn:active { opacity: 0.8; }
.ark-save-ok { font-size: 11px; font-weight: 800; color: #4ADE80; letter-spacing: 1px; }

/* ── Leaderboard (dolna sekcja) ── */
.lb-wrap { flex-shrink: 0; background: #000; border-top: 1px solid var(--border); max-height: 220px; overflow-y: auto; scrollbar-width: none; }
.lb-wrap::-webkit-scrollbar { display: none; }
.lb-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 6px; }
.lb-title { font-family: var(--font-d); font-size: 11px; font-weight: 900; letter-spacing: 3px; color: var(--bialy); }
.lb-filters { display: flex; gap: 4px; }
.lb-filter { padding: 3px 9px; border-radius: var(--r-pill); background: var(--tlo-karta); border: 1px solid var(--border); color: var(--szary); font-size: 9px; font-weight: 800; cursor: pointer; }
.lb-filter.active { background: var(--bialy); color: #000; border-color: var(--bialy); }
.lb-list { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 3px; }
.lb-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 10px; }
.lb-row.lb-mine { background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); }
.lb-rank { font-family: var(--font-d); font-size: 11px; font-weight: 800; color: var(--szary); width: 18px; text-align: center; flex-shrink: 0; }
.lb-rank-gold   { color: #FBBF24; }
.lb-rank-silver { color: #94A3B8; }
.lb-rank-bronze { color: #B45309; }
.lb-initials { font-family: var(--font-d); font-size: 13px; font-weight: 900; color: var(--bialy); flex: 1; letter-spacing: 2px; }
.lb-score-val { font-family: var(--font-d); font-size: 13px; font-weight: 800; color: var(--bialy); }
.lb-type { font-size: 8px; font-weight: 900; padding: 2px 6px; border-radius: 999px; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
.lb-type-trener   { background: rgba(59,130,246,0.15); color: #60A5FA; }
.lb-type-rodzic   { background: rgba(34,197,94,0.15);  color: #4ADE80; }
.lb-type-zawodnik { background: rgba(251,191,36,0.15); color: #FBBF24; }
.lb-type-kibic    { background: rgba(156,163,175,0.15);color: #9CA3AF; }
.lb-empty { text-align: center; padding: 16px; font-size: 11px; color: var(--szary); font-weight: 600; }
</style>

                    <button class="lb-filter" onclick="setLbFilter(this,'TRENER')">Trenerzy</button>
                    <button class="lb-filter" onclick="setLbFilter(this,'ZAWODNIK')">Zawodnicy</button>
                    <button class="lb-filter" onclick="setLbFilter(this,'RODZIC')">Rodzice</button>

<script src="coachay-core.js?v=20260730a"></script>
<script>
/* ═══════════════════════════════════════════════════
   ARKANOID — logika ekranu
═══════════════════════════════════════════════════ */

let arkUserId   = '';
let arkUserType = '';
let lbFilter    = 'ALL';
let allScores   = [];

/* ── Init ── */
window.addEventListener('DOMContentLoaded', () => {
    initFirebase();
    let _loaded = false;
    auth.onAuthStateChanged(async user => {
        if (_loaded) return;
        if (user) {
            _loaded = true;
            arkUserId = getCurrentUserId();
            await resolveUserType();
            loadLeaderboard();
            loadHiscore();
        } else {
            // Ekran dostępny też bez logowania (nie blokujemy)
            loadLeaderboard();
        }
        initArkanoid();
    });
});

async function resolveUserType() {
    if (!arkUserId || !db) return;
    try {
        const mbs = await getUserMemberships(arkUserId);
        const mb  = mbs[0];
        if (mb) arkUserType = mb.role === 'TRENER' ? (mb.trainerRole || 'TRENER_GLOWNY') : mb.role;
    } catch (e) {}
}

async function loadHiscore() {
    if (!arkUserId || !db) return;
    try {
        const doc = await db.collection('scores').doc(`ARKANOID_${arkUserId}`).get();
        if (doc.exists) {
            document.getElementById('ark-hiscore').textContent = doc.data().score || 0;
        }
    } catch (e) {}
}

/* ════════════════════════════════════════════════════
   SILNIK GRY
════════════════════════════════════════════════════ */
const BRICK_COLS   = 7;
const BRICK_ROWS   = 5;
const BRICK_PAD    = 4;
const BRICK_TOP    = 36;
const BRICK_H      = 14;
const PADDLE_H     = 10;
const PADDLE_W_PCT = 0.22;
const BALL_R       = 6;
const LIVES_MAX    = 3;

const BRICK_COLORS = ['#EF4444','#F97316','#EAB308','#22C55E','#3B82F6'];

let canvas, ctx;
let cW, cH;
let gameState = 'IDLE';
let score = 0;
let lives = LIVES_MAX;
let level = 1;
let bricks = [];
let paddle = {};
let ball = {};
let animId = null;
let scoreSaved = false;

function initArkanoid() {
    canvas = document.getElementById('ark-canvas');
    ctx    = canvas.getContext('2d');
    const wrap = canvas.parentElement;
    cW = wrap.offsetWidth  || 358;
    cH = wrap.offsetHeight || 300;
    canvas.width  = cW;
    canvas.height = cH;

    resetGame();
    drawIdle();

    canvas.addEventListener('touchstart', onTouchStart, { passive: false });
    canvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
    canvas.addEventListener('touchend',   onTouchEnd);
    canvas.addEventListener('mousemove',  onMouseMove);
    canvas.addEventListener('click',      onCanvasClick);

    window.addEventListener('resize', () => {
        cW = wrap.offsetWidth;
        cH = wrap.offsetHeight;
        canvas.width  = cW;
        canvas.height = cH;
        if (gameState === 'IDLE') drawIdle();
    });
}

function resetGame(keepScore) {
    if (!keepScore) { score = 0; lives = LIVES_MAX; level = 1; scoreSaved = false; }
    updateHud();
    paddle = { x: cW / 2 - (cW * PADDLE_W_PCT) / 2, y: cH - 28, w: cW * PADDLE_W_PCT };
    const spd = 3 + level * 0.35;
    ball = { x: cW / 2, y: paddle.y - BALL_R - 2, dx: spd * (Math.random() > 0.5 ? 1 : -1), dy: -spd, attached: true };
    buildBricks();
}

function buildBricks() {
    bricks = [];
    const bW = (cW - BRICK_PAD * 2 - BRICK_PAD * (BRICK_COLS - 1)) / BRICK_COLS;
    for (let r = 0; r < BRICK_ROWS; r++) {
        for (let c = 0; c < BRICK_COLS; c++) {
            bricks.push({
                x: BRICK_PAD + c * (bW + BRICK_PAD),
                y: BRICK_TOP + r * (BRICK_H + BRICK_PAD),
                w: bW, h: BRICK_H,
                color: BRICK_COLORS[r],
                alive: true
            });
        }
    }
}

/* ── Input ── */
function onTouchStart(e) {
    e.preventDefault();
    if (gameState === 'IDLE' || gameState === 'GAMEOVER') { startGame(); return; }
    if (ball.attached) ball.attached = false;
}
function onTouchMove(e) {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;
    const rect = canvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    paddle.x = Math.max(0, Math.min(cW - paddle.w, x - paddle.w / 2));
}
function onTouchEnd() {}
function onMouseMove(e) {
    if (gameState !== 'PLAYING') return;
    const rect = canvas.getBoundingClientRect();
    paddle.x = Math.max(0, Math.min(cW - paddle.w, e.clientX - rect.left - paddle.w / 2));
}
function onCanvasClick() {
    if (gameState === 'IDLE' || gameState === 'GAMEOVER') { startGame(); return; }
    if (gameState === 'PLAYING' && ball.attached) ball.attached = false;
}

/* ── Game flow ── */
function startGame() {
    const ov = document.getElementById('ark-overlay');
    ov.classList.add('hidden');
    gameState = 'PLAYING';
    if (animId) cancelAnimationFrame(animId);
    gameLoop();
}

function gameLoop() {
    update();
    draw();
    if (gameState === 'PLAYING') animId = requestAnimationFrame(gameLoop);
}

function update() {
    if (ball.attached) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - BALL_R - 1;
        return;
    }
    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.x - BALL_R < 0)  { ball.x = BALL_R; ball.dx =  Math.abs(ball.dx); }
    if (ball.x + BALL_R > cW) { ball.x = cW - BALL_R; ball.dx = -Math.abs(ball.dx); }
    if (ball.y - BALL_R < 0)  { ball.y = BALL_R; ball.dy =  Math.abs(ball.dy); }

    // Paletka
    if (ball.dy > 0 && ball.y + BALL_R >= paddle.y && ball.y + BALL_R <= paddle.y + PADDLE_H + 4 &&
        ball.x >= paddle.x - 4 && ball.x <= paddle.x + paddle.w + 4) {
        const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const spd = Math.sqrt(ball.dx * ball.dx + ball.dy * ball.dy);
        const angle = hit * 65 * (Math.PI / 180);
        ball.dx = spd * Math.sin(angle);
        ball.dy = -Math.abs(spd * Math.cos(angle));
        ball.y  = paddle.y - BALL_R - 1;
    }

    // Cegły
    for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
            ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
            b.alive = false;
            score += 10 * level;
            updateHud();
            const ol = (ball.x + BALL_R) - b.x;
            const or2 = (b.x + b.w) - (ball.x - BALL_R);
            const ot = (ball.y + BALL_R) - b.y;
            const ob = (b.y + b.h) - (ball.y - BALL_R);
            if (Math.min(ol, or2) < Math.min(ot, ob)) ball.dx *= -1; else ball.dy *= -1;
            break;
        }
    }

    // Następny poziom
    if (bricks.every(b => !b.alive)) {
        level++;
        resetGame(true);
        ball.attached = false;
        showLevelClear();
        return;
    }

    // Utrata życia
    if (ball.y - BALL_R > cH) {
        lives--;
        updateHud();
        if (lives <= 0) {
            gameState = 'GAMEOVER';
            showGameOver();
        } else {
            ball.attached = true;
            const spd = 3 + level * 0.35;
            ball.dx = spd * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -spd;
        }
    }
}

/* ── Rysowanie ── */
function draw() {
    ctx.clearRect(0, 0, cW, cH);
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, cW, cH);

    for (const b of bricks) {
        if (!b.alive) continue;
        ctx.fillStyle = b.color;
        roundRect(ctx, b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.18)';
        roundRect(ctx, b.x + 2, b.y + 2, b.w - 4, 4, 2);
        ctx.fill();
    }

    const grad = ctx.createLinearGradient(paddle.x, 0, paddle.x + paddle.w, 0);
    grad.addColorStop(0, '#3B82F6');
    grad.addColorStop(1, '#60A5FA');
    ctx.fillStyle = grad;
    roundRect(ctx, paddle.x, paddle.y, paddle.w, PADDLE_H, 5);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, BALL_R + 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.fill();
}

function drawIdle() {
    if (!ctx) return;
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, cW, cH);
    buildBricks();
    for (const b of bricks) {
        ctx.fillStyle = b.color + '44';
        roundRect(ctx, b.x, b.y, b.w, b.h, 4);
        ctx.fill();
    }
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

/* ── HUD ── */
function updateHud() {
    document.getElementById('ark-score').textContent = score;
    document.getElementById('ark-level').textContent = `LVL ${level}`;
    const el = document.getElementById('ark-lives');
    if (!el) return;
    el.innerHTML = '';
    for (let i = 0; i < LIVES_MAX; i++) {
        const s = document.createElement('span');
        s.className = 'ark-life';
        s.textContent = i < lives ? '●' : '○';
        s.style.color  = i < lives ? '#60A5FA' : '#374151';
        el.appendChild(s);
    }
}

/* ── Overlaye ── */
function showLevelClear() {
    const ov = document.getElementById('ark-overlay');
    ov.classList.remove('hidden');
    document.getElementById('ark-ov-logo').textContent   = 'POZIOM UKOŃCZONY!';
    document.getElementById('ark-ov-sub').textContent    = '';
    document.getElementById('ark-ov-level').textContent  = `POZIOM ${level}`;
    document.getElementById('ark-ov-level').style.display = 'block';
    document.getElementById('ark-ov-tap').style.display  = 'block';
    document.getElementById('ark-ov-tap').textContent    = 'DOTKNIJ ABY KONTYNUOWAĆ';
    document.getElementById('ark-ov-score').style.display      = 'none';
    document.getElementById('ark-ov-score-lbl').style.display  = 'none';
    document.getElementById('ark-initials-section').style.display = 'none';
    document.getElementById('ark-ov-btn').style.display   = 'none';
    gameState = 'IDLE'; // kliknięcie startuje następny poziom
}

function showGameOver() {
    const ov = document.getElementById('ark-overlay');
    ov.classList.remove('hidden');
    document.getElementById('ark-ov-logo').textContent          = 'GAME OVER';
    document.getElementById('ark-ov-sub').textContent           = '';
    document.getElementById('ark-ov-score').textContent         = score;
    document.getElementById('ark-ov-score').style.display       = 'block';
    document.getElementById('ark-ov-score-lbl').style.display   = 'block';
    document.getElementById('ark-ov-level').style.display       = 'none';
    document.getElementById('ark-ov-tap').style.display         = 'none';
    document.getElementById('ark-ov-btn').style.display         = 'inline-block';

    if (score > 0 && arkUserId && !scoreSaved) {
        buildInitialsInputs();
        document.getElementById('ark-initials-section').style.display = 'flex';
    } else {
        document.getElementById('ark-initials-section').style.display = 'none';
    }
}

function buildInitialsInputs() {
    const row = document.getElementById('ark-initials-row');
    row.innerHTML = '';
    for (let i = 0; i < 5; i++) {
        const inp = document.createElement('input');
        inp.className     = 'ark-init-input';
        inp.maxLength     = 1;
        inp.autocomplete  = 'off';
        inp.spellcheck    = false;
        inp.dataset.idx   = i;
        inp.addEventListener('input', () => {
            inp.value = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(-1);
            const next = row.querySelector(`[data-idx="${i + 1}"]`);
            if (inp.value && next) next.focus();
        });
        inp.addEventListener('keydown', e => {
            if (e.key === 'Backspace' && !inp.value) {
                const prev = row.querySelector(`[data-idx="${i - 1}"]`);
                if (prev) prev.focus();
            }
        });
        row.appendChild(inp);
    }
    setTimeout(() => row.querySelector('[data-idx="0"]')?.focus(), 80);
}

/* ── Zapis wyniku ── */
async function saveScore() {
    if (!arkUserId || !db || scoreSaved) return;
    const inputs   = document.querySelectorAll('.ark-init-input');
    const initials = Array.from(inputs).map(i => i.value.toUpperCase() || '_').join('').slice(0, 5).padEnd(5, '_');

    try {
        const ref      = db.collection('scores').doc(`ARKANOID_${arkUserId}`);
        const existing = await ref.get();
        if (!existing.exists || existing.data().score < score) {
            await ref.set({
                game:      'ARKANOID',
                initials,
                score,
                userType:  arkUserType || 'NIEZNANY',
                userId:    arkUserId,
                playedAt:  firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById('ark-hiscore').textContent = score;
        }
        scoreSaved = true;
        document.getElementById('ark-save-ok').style.display    = 'inline';
        document.getElementById('ark-initials-section').querySelector('.ark-save-btn').style.display = 'none';
        inputs.forEach(i => { i.disabled = true; });
        await loadLeaderboard();
    } catch (e) {
        console.error('❌ saveScore:', e);
    }
}

/* ── Leaderboard ── */
function setLbFilter(btn, filter) {
    document.querySelectorAll('.lb-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    lbFilter = filter;
    renderLeaderboard();
}

async function loadLeaderboard() {
    if (!db) return;
    try {
        const snap = await db.collection('scores')
            .where('game', '==', 'ARKANOID')
            .orderBy('score', 'desc')
            .limit(100)
            .get();
        allScores = snap.docs.map(d => d.data());
    } catch (e) { console.error('❌ loadLeaderboard:', e); }
    renderLeaderboard();
}

function renderLeaderboard() {
    const el = document.getElementById('lb-list');
    if (!el) return;
    let filtered = allScores;
    if (lbFilter === 'TRENER')   filtered = allScores.filter(s => s.userType === 'TRENER_GLOWNY' || s.userType === 'TRENER_POMOCNICZY');
    if (lbFilter === 'ZAWODNIK') filtered = allScores.filter(s => s.userType === 'ZAWODNIK');
    if (lbFilter === 'RODZIC')   filtered = allScores.filter(s => s.userType === 'RODZIC');

    const top10 = filtered.slice(0, 10);
    if (!top10.length) { el.innerHTML = '<div class="lb-empty">Brak wyników — zagraj pierwszy!</div>'; return; }

    const typeInfo = {
        TRENER_GLOWNY:    { label:'Trener',   cls:'lb-type-trener' },
        TRENER_POMOCNICZY:{ label:'Trener',   cls:'lb-type-trener' },
        RODZIC:           { label:'Rodzic',   cls:'lb-type-rodzic' },
        ZAWODNIK:         { label:'Zawodnik', cls:'lb-type-zawodnik' },
        KIBIC:            { label:'Kibic',    cls:'lb-type-kibic' }
    };
    const rankCls = ['lb-rank-gold','lb-rank-silver','lb-rank-bronze'];

    el.innerHTML = top10.map((s, i) => {
        const mine = s.userId === arkUserId;
        const ti   = typeInfo[s.userType] || { label: '?', cls: 'lb-type-kibic' };
        return `<div class="lb-row${mine ? ' lb-mine' : ''}">
            <span class="lb-rank ${rankCls[i] || ''}">${i + 1}</span>
            <span class="lb-initials">${s.initials || '?????'}</span>
            <span class="lb-score-val">${s.score || 0}</span>
            <span class="lb-type ${ti.cls}">${ti.label}</span>
        </div>`;
    }).join('');
}
</script>
